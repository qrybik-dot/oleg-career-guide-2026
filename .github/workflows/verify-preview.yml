name: Verify published career guide
on:
  push:
    paths: ['.github/workflows/verify-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public static HTML
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html oleg-guide-offline.html; do
            url="https://rawcdn.githack.com/qrybik-dot/oleg-career-guide-2026/df1a3bdd4c5421110a0c00eece6feab6efd8bd66/$file"
            echo "Checking $url"
            curl -fsSL --retry 3 --retry-delay 2 -D /tmp/headers -o /tmp/site "$url"
            grep -qi '^content-type: text/html' /tmp/headers
            grep -q 'prompt-system' /tmp/site
            grep -q 'Скопировать' /tmp/site
            grep -q 'Олег, привет!' /tmp/site
            echo "OK: $(wc -c < /tmp/site) bytes of $file"
          done
