name: Verify published career guide v4
on:
  push:
    paths: ['.github/workflows/verify-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public HTML files and local crosslink
        shell: bash
        run: |
          set -euo pipefail
          base="https://rawcdn.githack.com/qrybik-dot/oleg-career-guide-2026/4671ac2b295f43335b5cc1259c8ad3fa55adad2e"
          curl -fsSL --retry 3 --retry-delay 2 -D /tmp/indexheaders -o /tmp/index "$base/index.html"
          curl -fsSL --retry 3 --retry-delay 2 -D /tmp/guideheaders -o /tmp/guide "$base/oleg-guide-offline.html"
          grep -qi '^content-type: text/html' /tmp/indexheaders
          grep -qi '^content-type: text/html' /tmp/guideheaders
          grep -q 'oleg-guide-offline.html' /tmp/index
          grep -q 'Скопировать инструкции проекта' /tmp/index
          grep -q 'ОГЛАВЛЕНИЕ' /tmp/guide
          grep -q 'data-theme="dark"' /tmp/guide
          grep -q 'join.granola.ai/t/fvwxtk7mgm' /tmp/guide
          grep -q 't.me/rff_channel/327' /tmp/guide
          test "$(wc -c </tmp/index)" -gt 30000
          test "$(wc -c </tmp/guide)" -gt 60000
          echo "PASS public site and guide"
